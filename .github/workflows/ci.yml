name: content checks
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: L2/gloss alignment + storyboard consistency
        run: python tools/check_alignment.py
